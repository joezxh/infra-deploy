# ============================================================
# 矛盾纠纷调解平台 - Docker Compose 开发环境
# 使用: docker-compose -f docker-compose.dev.yml up -d
# ============================================================

services:
  # ========== MySQL 8.0 数据库 ==========
  mysql:
    image: docker.1ms.run/library/mysql:8.0.46
    container_name: mediation-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mediation123
      MYSQL_DATABASE: mediation_db
      MYSQL_USER: mediation
      MYSQL_PASSWORD: mediation123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/db:/docker-entrypoint-initdb.d:ro  # 自动初始化脚本
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=1000
      - --innodb_buffer_pool_size=512M
    networks:
      - mediation-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pmediation123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ========== Redis 7.x ==========
  redis:
    image: docker.1ms.run/library/redis:7-alpine
    container_name: mediation-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command:
      - redis-server
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - yes
      - --appendfsync
      - everysec
    networks:
      - mediation-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ========== Nacos 3.x (服务注册与配置中心) ==========
  nacos:
    image: docker.1ms.run/nacos/nacos-server:v3.2.1
    container_name: mediation-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos_db
      MYSQL_SERVICE_USER: mediation
      MYSQL_SERVICE_PASSWORD: mediation123
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
      NACOS_AUTH_ENABLE: false
      NACOS_AUTH_TOKEN: VGVhck1lZGlhdGlvblBsYXRmb3JtMjAyNiEwQGRkZGVkQXNQZWNyZXRLZXk=
      NACOS_AUTH_CACHE_ENABLED: false
      NACOS_AUTH_IDENTITY_KEY: VGVhck1lZGlhdGlvbklkZW50aXR5S2V5MjAyNg==
      NACOS_AUTH_IDENTITY_VALUE: VGVhck1lZGlhdGlvbklkZW50aXR5VmFsdWUyMDI2
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    ports:
      - "9848:9848"   # gRPC端口
      - "8848:8080"   # 控制台端口 (Nacos 3.x 内置Tomcat监听8080)
    volumes:
      - nacos_data:/home/nacos/data
      - nacos_logs:/home/nacos/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - mediation-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ========== Sentinel (流量控制) ==========
  sentinel:
    image: docker.1ms.run/bladex/sentinel-dashboard:1.8.9
    container_name: mediation-sentinel
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-Dserver.port=8858 -Dcsp.sentinel.dashboard.server=localhost:8858 -Dproject.name=sentinel-dashboard"
    ports:
      - "8858:8858"
    volumes:
      - sentinel_data:/tmp/sentinel
    networks:
      - mediation-net

  # ========== MinIO (对象存储 - 文件上传) ==========
  minio:
    image: docker.1ms.run/minio/minio:latest
    container_name: mediation-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: mediation
      MINIO_ROOT_PASSWORD: mediation123456
      MINIO_DEFAULT_BUCKETS: mediation-files
    ports:
      - "9000:9000"   # API端口
      - "9001:9001"   # Console端口
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - mediation-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ========== Nginx (反向代理 - 后端服务在宿主机运行) ==========
  nginx:
    image: docker.1ms.run/library/nginx:1.30-alpine
    container_name: mediation-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_logs:/var/log/nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mediation-net

# ============================================================
# 网络配置
# ============================================================
networks:
  mediation-net:
    driver: bridge
    name: mediation-network

# ============================================================
# 存储卷配置
# ============================================================
volumes:
  mysql_data:
    name: mediation-mysql-data
  redis_data:
    name: mediation-redis-data
  nacos_data:
    name: mediation-nacos-data
  nacos_logs:
    name: mediation-nacos-logs
  sentinel_data:
    name: mediation-sentinel-data
  minio_data:
    name: mediation-minio-data
  nginx_logs:
    name: mediation-nginx-logs
