# ============================================================
# HAProxy Configuration for MySQL Cluster
# ============================================================

global
    log stdout format raw local0
    maxconn 4096
    user root
    group root
    daemon
    stats socket /var/run/haproxy.sock mode 600 level admin
    stats timeout 2m

defaults
    log     global
    retries 3
    timeout client  3600s
    timeout server  3600s
    timeout connect 10s

# MySQL 监控页面
listen admin_stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 30s
    stats realm Haproxy\ Statistics
    stats auth admin:admin

# MySQL 读操作负载均衡
listen mysql_read
    bind *:33060
    mode tcp
    option mysql-check user haproxy
    balance roundrobin
    server mysql1 mediation-mysql-cluster-1:3306 check inter 5s rise 2 fall 3
    server mysql2 mediation-mysql-cluster-2:3306 check inter 5s rise 2 fall 3
    server mysql3 mediation-mysql-cluster-3:3306 check inter 5s rise 2 fall 3

# MySQL 写操作 (单主模式，可选)
listen mysql_write
    bind *:33061
    mode tcp
    option mysql-check user haproxy
    balance roundrobin
    server mysql1 mediation-mysql-cluster-1:3306 check inter 5s rise 2 fall 3 backup
