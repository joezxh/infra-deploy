# ============================================================
# 矛盾纠纷调解平台 - PostgreSQL 版单机部署
# 适用于开发、测试、小规模生产环境
# 使用: docker compose -f docker-compose.pg.single.yml up -d
# ============================================================

services:
  # ============================================================
  # PostgreSQL 17 + pgvector (向量数据库 - AI向量化存储)
  # ============================================================
  postgres:
    image: pgvector/pgvector:pg17
    container_name: mediation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-mediation}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-mediation123}
      POSTGRES_DB: mediation_db
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Asia/Shanghai
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_conf:/etc/postgresql/conf.d
    command:
      - postgres
      - -cshared_preload_libraries=vector
      - -cmax_connections=500
      - -cwork_mem=64MB
      - -cmaintenance_work_mem=256MB
      - -ceffective_cache_size=2GB
      - -ccheckpoint_completion_target=0.9
      - -cwal_buffers=16MB
      - -cdefault_statistics_target=200
      - -crandom_page_cost=1.1
      - -ceffective_io_concurrency=200
      - -ctemp_buffers=256MB
      - -cmax_wal_size=4GB
    networks:
      - mediation-infra
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-mediation}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================
  # Redis 7.x (缓存 + Session存储)
  # ============================================================
  redis:
    image: redis:7.4-alpine
    container_name: mediation-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command:
      - redis-server
      - --maxmemory=${REDIS_MAXMEMORY:-512mb}
      - --maxmemory-policy=allkeys-lru
      - --appendonly=yes
      - --appendfsync=everysec
    networks:
      - mediation-infra
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ============================================================
  # Nacos 3.2.1 (配置中心 + 服务注册)
  # ============================================================
  nacos:
    image: nacos/nacos-server:v3.2.1
    container_name: mediation-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: postgresql
      MYSQL_SERVICE_HOST: postgres
      MYSQL_SERVICE_PORT: 5432
      MYSQL_SERVICE_DB_NAME: nacos_db
      MYSQL_SERVICE_USER: ${PG_USER:-mediation}
      MYSQL_SERVICE_PASSWORD: ${PG_PASSWORD:-mediation123}
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE:-false}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-VGVhck1lZGlhdGlvblBsYXRmb3JtMjAyNiEwQGRkZGVkQXNQZWNyZXRLZXk=}
      NACOS_AUTH_CACHE_ENABLED: ${NACOS_AUTH_CACHE_ENABLED:-false}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-VGVhck1lZGlhdGlvbklkZW50aXR5S2V5MjAyNg==}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-VGVhck1lZGlhdGlvbklkZW50aXR5VmFsdWUyMDI2}
      JVM_XMS: ${NACOS_JVM_XMS:-512m}
      JVM_XMX: ${NACOS_JVM_XMX:-1024m}
      JVM_XMN: ${NACOS_JVM_XMN:-256m}
      JVM_MS: ${NACOS_JVM_MS:-128m}
      JVM_MMS: ${NACOS_JVM_MMS:-256m}
      NACOS_SERVER_PORT: 8848
    ports:
      - "${NACOS_PORT:-8848}:8848"
      - "${NACOS_GRPC_PORT:-9848}:9848"
      - "${NACOS_RAFT_PORT:-9849}:9849"
    volumes:
      - nacos_data:/home/nacos/data
      - nacos_logs:/home/nacos/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mediation-infra
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ============================================================
  # Neo4j 社区版 (图数据库 - 关系图谱)
  # ============================================================
  neo4j:
    image: neo4j:5.22-community
    container_name: mediation-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-mediation123}
      NEO4J_ACCEPT_LICENSE_AGREEMENT: yes
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_memory_heap_initial__size: ${NEO4J_HEAP_SIZE:-512m}
      NEO4J_dbms_memory_heap_max__size: ${NEO4J_HEAP_MAX_SIZE:-2g}
      NEO4J_dbms_memory_pagecache_size: ${NEO4J_PAGECACHE_SIZE:-1g}
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*,gds.*
      NEO4J_dbms_tx_log_rotation_retention__policy: ${NEO4J_TX_LOG_RETENTION:-10 files}
      NEO4J_dbms_memory_transaction_max__size: ${NEO4J_TX_MAX_SIZE:-128m}
      TZ: Asia/Shanghai
    ports:
      - "${NEO4J_BOLT_PORT:-7687}:7687"
      - "${NEO4J_HTTP_PORT:-7474}:7474"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    networks:
      - mediation-infra
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER:-neo4j}", "-p", "${NEO4J_PASSWORD:-mediation123}", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================================
  # NebulaGraph 社区版 (分布式图数据库)
  # ============================================================
  nebula-metad:
    image: vesoft/nebula-metad:v3.8.0
    container_name: mediation-nebula-metad
    restart: unless-stopped
    environment:
      USER: root
      TZ: Asia/Shanghai
    ports:
      - "${NEBULA_METAD_PORT:-9559}:9559"
    volumes:
      - nebula_metad_data:/usr/local/nebula/data
      - nebula_metad_logs:/usr/local/nebula/logs
    command:
      - --meta_server_addrs=127.0.0.1:9559
      - --local_ip=127.0.0.1
      - --ws_ip=127.0.0.1
      - --port_base=9000
      - --data_path=/usr/local/nebula/data
      - --log_dir=/usr/local/nebula/logs
      - --v=0
      - --minloglevel=2
    networks:
      - mediation-infra

  nebula-storaged:
    image: vesoft/nebula-storaged:v3.8.0
    container_name: mediation-nebula-storaged
    restart: unless-stopped
    environment:
      USER: root
      TZ: Asia/Shanghai
    ports:
      - "${NEBULA_STORAGED_PORT:-9779}:9779"
    volumes:
      - nebula_storaged_data:/usr/local/nebula/data
      - nebula_storaged_logs:/usr/local/nebula/logs
    depends_on:
      - nebula-metad
    command:
      - --meta_server_addrs=127.0.0.1:9559
      - --local_ip=127.0.0.1
      - --ws_ip=127.0.0.1
      - --port_base=9100
      - --data_path=/usr/local/nebula/data
      - --log_dir=/usr/local/nebula/logs
      - --v=0
      - --minloglevel=2
      - --enable_auto_remove_leader=true
    networks:
      - mediation-infra

  nebula-graphd:
    image: vesoft/nebula-graphd:v3.8.0
    container_name: mediation-nebula-graphd
    restart: unless-stopped
    environment:
      USER: root
      TZ: Asia/Shanghai
    ports:
      - "${NEBULA_GRAPH_PORT:-9669}:9669"
    volumes:
      - nebula_graphd_logs:/usr/local/nebula/logs
    depends_on:
      - nebula-metad
      - nebula-storaged
    command:
      - --meta_server_addrs=127.0.0.1:9559
      - --local_ip=127.0.0.1
      - --ws_ip=127.0.0.1
      - --port_base=9200
      - --log_dir=/usr/local/nebula/logs
      - --v=0
      - --minloglevel=2
      - --enable_authorize=true
    networks:
      - mediation-infra

  # ============================================================
  # MinIO (对象存储)
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: mediation-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-mediation}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-mediation123456}
      MINIO_DEFAULT_BUCKETS: mediation-files
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - mediation-infra
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ============================================================
  # Nginx (反向代理)
  # ============================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: mediation-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_logs:/var/log/nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mediation-infra

# ============================================================
# 网络配置
# ============================================================
networks:
  mediation-infra:
    driver: bridge
    name: mediation-infra-network

# ============================================================
# 存储卷配置
# ============================================================
volumes:
  postgres_data:
    name: mediation-postgres-data
  postgres_conf:
    name: mediation-postgres-conf
  redis_data:
    name: mediation-redis-data
  nacos_data:
    name: mediation-nacos-data
  nacos_logs:
    name: mediation-nacos-logs
  neo4j_data:
    name: mediation-neo4j-data
  neo4j_logs:
    name: mediation-neo4j-logs
  neo4j_plugins:
    name: mediation-neo4j-plugins
  nebula_metad_data:
    name: mediation-nebula-metad-data
  nebula_metad_logs:
    name: mediation-nebula-metad-logs
  nebula_storaged_data:
    name: mediation-nebula-storaged-data
  nebula_storaged_logs:
    name: mediation-nebula-storaged-logs
  nebula_graphd_logs:
    name: mediation-nebula-graphd-logs
  minio_data:
    name: mediation-minio-data
  nginx_logs:
    name: mediation-nginx-logs
