# ============================================================
# PostgreSQL + Neo4j 高可用集群部署
# 使用: docker compose up -d
# ============================================================

services:
  # ============================================================
  # PostgreSQL Patroni HA 集群
  # ============================================================
  postgres-1:
    image: bitnami/patroni:17
    container_name: mediation-postgres-1
    restart: always
    environment:
      PATRONI_SCOPE: mediation-pg-cluster
      PATRONI_NAME: postgres-1
      PATRONI_SUPERUSER_USERNAME: ${PG_USER:-mediation}
      PATRONI_SUPERUSER_PASSWORD: ${PG_PASSWORD:-mediation123}
      PATRONI_REPLICATION_USERNAME: repl_user
      PATRONI_REPLICATION_PASSWORD: ${PG_REPL_PASSWORD:-repl123456}
      PATRONI_POSTGRES_PASSWORD: ${PG_PASSWORD:-mediation123}
      PATRONI_LOG_LEVEL: INFO
      PATRONI_api_port: 8008
      PATRONI_RESTAPI_CONNECT_ADDRESS: postgres-1:8008
      PATRONI_POSTGRES_DATA_DIR: /bitnami/postgresql/data
      PATRONI_KONSENSUS_HOST: postgres-1:2379
      POSTGRES_EXTRA_FLAGS: "-c shared_preload_libraries=vector"
    ports:
      - "${PG_PORT:-5432}:5432"
      - "${PG_API_PORT:-8008}:8008"
    volumes:
      - postgres_data1:/bitnami/postgresql/data
    networks:
      - mediation-cluster
    command: run

  postgres-2:
    image: bitnami/patroni:17
    container_name: mediation-postgres-2
    restart: always
    environment:
      PATRONI_SCOPE: mediation-pg-cluster
      PATRONI_NAME: postgres-2
      PATRONI_SUPERUSER_USERNAME: ${PG_USER:-mediation}
      PATRONI_SUPERUSER_PASSWORD: ${PG_PASSWORD:-mediation123}
      PATRONI_REPLICATION_USERNAME: repl_user
      PATRONI_REPLICATION_PASSWORD: ${PG_REPL_PASSWORD:-repl123456}
      PATRONI_POSTGRES_PASSWORD: ${PG_PASSWORD:-mediation123}
      PATRONI_LOG_LEVEL: INFO
      PATRONI_api_port: 8008
      PATRONI_RESTAPI_CONNECT_ADDRESS: postgres-2:8008
      PATRONI_POSTGRES_DATA_DIR: /bitnami/postgresql/data
      PATRONI_KONSENSUS_HOST: postgres-2:2379
      POSTGRES_EXTRA_FLAGS: "-c shared_preload_libraries=vector"
    ports:
      - "${PG_PORT_2:-5433}:5432"
      - "${PG_API_PORT_2:-8009}:8008"
    volumes:
      - postgres_data2:/bitnami/postgresql/data
    networks:
      - mediation-cluster
    command: run

  postgres-3:
    image: bitnami/patroni:17
    container_name: mediation-postgres-3
    restart: always
    environment:
      PATRONI_SCOPE: mediation-pg-cluster
      PATRONI_NAME: postgres-3
      PATRONI_SUPERUSER_USERNAME: ${PG_USER:-mediation}
      PATRONI_SUPERUSER_PASSWORD: ${PG_PASSWORD:-mediation123}
      PATRONI_REPLICATION_USERNAME: repl_user
      PATRONI_REPLICATION_PASSWORD: ${PG_REPL_PASSWORD:-repl123456}
      PATRONI_POSTGRES_PASSWORD: ${PG_PASSWORD:-mediation123}
      PATRONI_LOG_LEVEL: INFO
      PATRONI_api_port: 8008
      PATRONI_RESTAPI_CONNECT_ADDRESS: postgres-3:8008
      PATRONI_POSTGRES_DATA_DIR: /bitnami/postgresql/data
      PATRONI_KONSENSUS_HOST: postgres-3:2379
      POSTGRES_EXTRA_FLAGS: "-c shared_preload_libraries=vector"
    ports:
      - "${PG_PORT_3:-5434}:5432"
      - "${PG_API_PORT_3:-8010}:8008"
    volumes:
      - postgres_data3:/bitnami/postgresql/data
    networks:
      - mediation-cluster
    command: run

  # etcd 分布式协调
  etcd:
    image: bitnami/etcd:3.5
    container_name: mediation-etcd
    restart: always
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
    ports:
      - "${ETCD_PORT:-2379}:2379"
    volumes:
      - etcd_data:/bitnami/etcd
    networks:
      - mediation-cluster

  # PgBouncer 连接池
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: mediation-pgbouncer
    restart: always
    environment:
      DATABASE_URL: "host=postgres-1 port=5432 dbname=mediation_db user=${PG_USER:-mediation} password=${PG_PASSWORD:-mediation123}"
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 50
    ports:
      - "${PGBOUNCER_PORT:-5435}:5432"
    depends_on:
      - postgres-1
    networks:
      - mediation-cluster

  # ============================================================
  # Redis Sentinel 高可用
  # ============================================================
  redis-master:
    image: redis:7.4-alpine
    container_name: mediation-redis-master
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_master_data:/data
    command:
      - redis-server
      - --requirepass ${REDIS_PASSWORD:-redis123}
      - --masterauth ${REDIS_PASSWORD:-redis123}
      - --appendonly=yes
      - --maxmemory=1gb
      - --maxmemory-policy=allkeys-lru
    networks:
      - mediation-cluster

  redis-replica:
    image: redis:7.4-alpine
    container_name: mediation-redis-replica
    restart: always
    ports:
      - "${REDIS_PORT_2:-6380}:6379"
    volumes:
      - redis_replica_data:/data
    command:
      - redis-server
      - --requirepass ${REDIS_PASSWORD:-redis123}
      - --masterauth ${REDIS_PASSWORD:-redis123}
      - --replicaof redis-master 6379
      - --appendonly=yes
    depends_on:
      - redis-master
    networks:
      - mediation-cluster

  redis-sentinel:
    image: redis:7.4-alpine
    container_name: mediation-redis-sentinel
    restart: always
    ports:
      - "${REDIS_SENTINEL_PORT:-26379}:26379"
    command: >
      redis-server
      --sentinel monitor mediation-master redis-master 6379 2
      --sentinel down-after-milliseconds mediation-master 5000
      --sentinel failover-timeout mediation-master 10000
      --sentinel parallel-syncs mediation-master 1
      --sentinel auth-pass mediation-master ${REDIS_PASSWORD:-redis123}
    depends_on:
      - redis-master
    networks:
      - mediation-cluster

  # ============================================================
  # Nacos 集群
  # ============================================================
  nacos-1:
    image: nacos/nacos-server:v3.2.1
    container_name: mediation-nacos-1
    restart: always
    environment:
      MODE: cluster
      NACOS_SERVERS: "nacos-1:8848 nacos-2:8848 nacos-3:8848"
      SPRING_DATASOURCE_PLATFORM: postgresql
      MYSQL_SERVICE_HOST: ${PG_SERVICE_HOST_HA:-pgbouncer}
      MYSQL_SERVICE_PORT: ${PG_SERVICE_PORT_HA:-5432}
      MYSQL_SERVICE_DB_NAME: ${NACOS_DB_NAME:-nacos_db}
      MYSQL_SERVICE_USER: ${PG_USER:-mediation}
      MYSQL_SERVICE_PASSWORD: ${PG_PASSWORD:-mediation123}
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE:-true}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-bWVkaWF0aW9uUGxhdGZvcm1OYWNvc1NlY3VyaXR5S2V5MzJCeXRlcw==}
      NACOS_AUTH_TOKEN_EXPIRE_SECONDS: ${NACOS_AUTH_TOKEN_EXPIRE_SECONDS:-18000}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-serverIdentity}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-nacos}
      NACOS_CONFIG_NAMESPACE_MIGRATE_ENABLE: ${NACOS_CONFIG_NAMESPACE_MIGRATE_ENABLE:-false}
      JVM_XMS: ${NACOS_JVM_XMS:-512m}
      JVM_XMX: ${NACOS_JVM_XMX:-2g}
    ports:
      - "${NACOS_PORT:-8848}:8848"
      - "${NACOS_GRPC_PORT:-9848}:9848"
    volumes:
      - nacos_data1:/home/nacos/data
      - nacos_logs1:/home/nacos/logs
    depends_on:
      - postgres-1
    networks:
      - mediation-cluster

  nacos-2:
    image: nacos/nacos-server:v3.2.1
    container_name: mediation-nacos-2
    restart: always
    environment:
      MODE: cluster
      NACOS_SERVERS: "nacos-1:8848 nacos-2:8848 nacos-3:8848"
      SPRING_DATASOURCE_PLATFORM: postgresql
      MYSQL_SERVICE_HOST: ${PG_SERVICE_HOST_HA:-pgbouncer}
      MYSQL_SERVICE_PORT: ${PG_SERVICE_PORT_HA:-5432}
      MYSQL_SERVICE_DB_NAME: ${NACOS_DB_NAME:-nacos_db}
      MYSQL_SERVICE_USER: ${PG_USER:-mediation}
      MYSQL_SERVICE_PASSWORD: ${PG_PASSWORD:-mediation123}
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE:-true}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-bWVkaWF0aW9uUGxhdGZvcm1OYWNvc1NlY3VyaXR5S2V5MzJCeXRlcw==}
      NACOS_AUTH_TOKEN_EXPIRE_SECONDS: ${NACOS_AUTH_TOKEN_EXPIRE_SECONDS:-18000}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-serverIdentity}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-nacos}
      NACOS_CONFIG_NAMESPACE_MIGRATE_ENABLE: ${NACOS_CONFIG_NAMESPACE_MIGRATE_ENABLE:-false}
      JVM_XMS: ${NACOS_JVM_XMS:-512m}
      JVM_XMX: ${NACOS_JVM_XMX:-2g}
    ports:
      - "${NACOS_PORT_2:-8858}:8848"
      - "${NACOS_GRPC_PORT_2:-9868}:9848"
    volumes:
      - nacos_data2:/home/nacos/data
      - nacos_logs2:/home/nacos/logs
    networks:
      - mediation-cluster

  nacos-3:
    image: nacos/nacos-server:v3.2.1
    container_name: mediation-nacos-3
    restart: always
    environment:
      MODE: cluster
      NACOS_SERVERS: "nacos-1:8848 nacos-2:8848 nacos-3:8848"
      SPRING_DATASOURCE_PLATFORM: postgresql
      MYSQL_SERVICE_HOST: ${PG_SERVICE_HOST_HA:-pgbouncer}
      MYSQL_SERVICE_PORT: ${PG_SERVICE_PORT_HA:-5432}
      MYSQL_SERVICE_DB_NAME: ${NACOS_DB_NAME:-nacos_db}
      MYSQL_SERVICE_USER: ${PG_USER:-mediation}
      MYSQL_SERVICE_PASSWORD: ${PG_PASSWORD:-mediation123}
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE:-true}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-bWVkaWF0aW9uUGxhdGZvcm1OYWNvc1NlY3VyaXR5S2V5MzJCeXRlcw==}
      NACOS_AUTH_TOKEN_EXPIRE_SECONDS: ${NACOS_AUTH_TOKEN_EXPIRE_SECONDS:-18000}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-serverIdentity}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-nacos}
      NACOS_CONFIG_NAMESPACE_MIGRATE_ENABLE: ${NACOS_CONFIG_NAMESPACE_MIGRATE_ENABLE:-false}
      JVM_XMS: ${NACOS_JVM_XMS:-512m}
      JVM_XMX: ${NACOS_JVM_XMX:-2g}
    ports:
      - "${NACOS_PORT_3:-8868}:8848"
      - "${NACOS_GRPC_PORT_3:-9878}:9848"
    volumes:
      - nacos_data3:/home/nacos/data
      - nacos_logs3:/home/nacos/logs
    networks:
      - mediation-cluster

  # ============================================================
  # Neo4j 集群 (负载均衡实现 HA)
  # ============================================================
  neo4j-1:
    image: neo4j:5.22-community
    container_name: mediation-neo4j-1
    restart: always
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-mediation123}
      NEO4J_ACCEPT_LICENSE_AGREEMENT: yes
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_memory_heap_initial__size: ${NEO4J_HEAP_SIZE:-1g}
      NEO4J_dbms_memory_heap_max__size: ${NEO4J_HEAP_MAX_SIZE:-4g}
      NEO4J_dbms_memory_pagecache_size: ${NEO4J_PAGECACHE_SIZE:-2g}
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
      TZ: Asia/Shanghai
    ports:
      - "${NEO4J_BOLT_PORT:-7687}:7687"
      - "${NEO4J_HTTP_PORT:-7474}:7474"
    volumes:
      - neo4j_data1:/data
      - neo4j_logs1:/logs
      - neo4j_backups:/backups
    networks:
      - mediation-cluster

  neo4j-2:
    image: neo4j:5.22-community
    container_name: mediation-neo4j-2
    restart: always
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-mediation123}
      NEO4J_ACCEPT_LICENSE_AGREEMENT: yes
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_memory_heap_initial__size: ${NEO4J_HEAP_SIZE:-1g}
      NEO4J_dbms_memory_heap_max__size: ${NEO4J_HEAP_MAX_SIZE:-4g}
      NEO4J_dbms_memory_pagecache_size: ${NEO4J_PAGECACHE_SIZE:-2g}
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
      TZ: Asia/Shanghai
    ports:
      - "${NEO4J_BOLT_PORT_2:-7688}:7687"
      - "${NEO4J_HTTP_PORT_2:-7475}:7474"
    volumes:
      - neo4j_data2:/data
      - neo4j_logs2:/logs
    networks:
      - mediation-cluster

  # Neo4j HAProxy
  neo4j-haproxy:
    image: haproxy:2.9-alpine
    container_name: mediation-neo4j-haproxy
    restart: always
    ports:
      - "${NEO4J_PROXY_BOLT_PORT:-7689}:7687"
      - "${NEO4J_PROXY_HTTP_PORT:-7476}:7474"
    volumes:
      - ./haproxy-neo4j.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - neo4j-1
      - neo4j-2
    networks:
      - mediation-cluster

  # ============================================================
  # MinIO 集群
  # ============================================================
  minio-1:
    image: minio/minio:latest
    container_name: mediation-minio-1
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-mediation}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-mediation123456}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data1:/data
    networks:
      - mediation-cluster
    command: server http://minio-{1,2,3,4}/data --console-address ":9001"

  minio-2:
    image: minio/minio:latest
    container_name: mediation-minio-2
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-mediation}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-mediation123456}
    ports:
      - "${MINIO_API_PORT_2:-9010}:9000"
      - "${MINIO_CONSOLE_PORT_2:-9011}:9001"
    volumes:
      - minio_data2:/data
    networks:
      - mediation-cluster
    command: server http://minio-{1,2,3,4}/data --console-address ":9001"

  minio-3:
    image: minio/minio:latest
    container_name: mediation-minio-3
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-mediation}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-mediation123456}
    ports:
      - "${MINIO_API_PORT_3:-9020}:9000"
      - "${MINIO_CONSOLE_PORT_3:-9021}:9001"
    volumes:
      - minio_data3:/data
    networks:
      - mediation-cluster
    command: server http://minio-{1,2,3,4}/data --console-address ":9001"

  minio-4:
    image: minio/minio:latest
    container_name: mediation-minio-4
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-mediation}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-mediation123456}
    ports:
      - "${MINIO_API_PORT_4:-9030}:9000"
      - "${MINIO_CONSOLE_PORT_4:-9031}:9001"
    volumes:
      - minio_data4:/data
    networks:
      - mediation-cluster
    command: server http://minio-{1,2,3,4}/data --console-address ":9001"

networks:
  mediation-cluster:
    driver: bridge

volumes:
  postgres_data1:
  postgres_data2:
  postgres_data3:
  etcd_data:
  redis_master_data:
  redis_replica_data:
  nacos_data1:
  nacos_data2:
  nacos_data3:
  nacos_logs1:
  nacos_logs2:
  nacos_logs3:
  neo4j_data1:
  neo4j_data2:
  neo4j_logs1:
  neo4j_logs2:
  neo4j_backups:
  minio_data1:
  minio_data2:
  minio_data3:
  minio_data4:
