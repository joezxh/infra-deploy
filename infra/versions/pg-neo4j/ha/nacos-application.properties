# Nacos 应用配置 (PostgreSQL + Neo4j 高可用版)
# 禁用命名空间迁移检查
nacos.config.namespace.migrate.enable=false

# 数据库配置 (PostgreSQL 通过 PgBouncer 连接)
db.num=1
db.url.0=jdbc:postgresql://pgbouncer:5432/nacos_db?connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false
db.user.0=mediation
db.password.0=mediation123
db.pool.config.connectionTimeout=30000
db.pool.config.validationTimeout=10000
db.pool.config.minimumIdle=2
db.pool.config.maximumPoolSize=20

