# ============================================================
# MySQL + Neo4j 单机版部署
# 使用: docker compose up -d
# ============================================================

services:
  # ============================================================
  # MySQL 8.x
  # ============================================================
  mysql:
    image: mysql:8.4.0
    container_name: mediation-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mediation123}
      MYSQL_DATABASE: mediation_db
      MYSQL_USER: ${MYSQL_USER:-mediation}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mediation123}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=1000
      - --innodb_buffer_pool_size=1G
    networks:
      - mediation-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-mediation123}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ============================================================
  # Redis 7.x
  # ============================================================
  redis:
    image: redis:7.4-alpine
    container_name: mediation-redis
    restart: unless-stopped
    environment:
      REDIS_REPLICATION_MODE: master
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command:
      - redis-server
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - yes
    networks:
      - mediation-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ============================================================
  # Nacos 3.2.1
  # ============================================================
  nacos:
    image: nacos/nacos-server:v3.2.1
    container_name: mediation-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: ${MYSQL_SERVICE_HOST:-mysql}
      MYSQL_SERVICE_PORT: ${MYSQL_SERVICE_PORT:-3306}
      MYSQL_SERVICE_DB_NAME: ${NACOS_DB_NAME:-nacos_db}
      MYSQL_SERVICE_USER: ${MYSQL_USER:-mediation}
      MYSQL_SERVICE_PASSWORD: ${MYSQL_PASSWORD:-mediation123}
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
      NACOS_AUTH_ENABLE: ${NACOS_AUTH_ENABLE:-false}
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-OSLWtE3rb28I/22RVKymUPDuaHWLGyYCDCi2qJ+fFB0=}
      NACOS_AUTH_CACHE_ENABLED: ${NACOS_AUTH_CACHE_ENABLED:-false}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-Y2xvdWRfbmFjb3NfY29uZmlndXJhdGlvbl9rZXlfMjAyNQ==}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-Y2xvdWRfbmFjb3NfY29uZmlndXJhdGlvbl92YWx1ZV8yMDI1}
      NACOS_CONFIG_NAMESPACE_MIGRATE_ENABLE: ${NACOS_CONFIG_NAMESPACE_MIGRATE_ENABLE:-false}
      JVM_XMS: ${NACOS_JVM_XMS:-512m}
      JVM_XMX: ${NACOS_JVM_XMX:-1024m}
    ports:
      - "${NACOS_PORT:-8848}:8848"
      - "${NACOS_HTTP_PORT:-8080}:8080"
      - "${NACOS_GRPC_PORT:-9848}:9848"
    volumes:
      - nacos_data:/home/nacos/data
      - nacos_logs:/home/nacos/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - mediation-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/nacos/v1/ns/operator/metrics"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ============================================================
  # Neo4j 社区版
  # ============================================================
  neo4j:
    image: neo4j:5.22-community
    container_name: mediation-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-mediation123}
      NEO4J_ACCEPT_LICENSE_AGREEMENT: yes
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_memory_heap_initial__size: ${NEO4J_HEAP_SIZE:-512m}
      NEO4J_dbms_memory_heap_max__size: ${NEO4J_HEAP_MAX_SIZE:-2g}
      NEO4J_dbms_memory_pagecache_size: ${NEO4J_PAGECACHE_SIZE:-1g}
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
      TZ: Asia/Shanghai
    ports:
      - "${NEO4J_BOLT_PORT:-7687}:7687"
      - "${NEO4J_HTTP_PORT:-7474}:7474"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - mediation-net
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "${NEO4J_USER:-neo4j}", "-p", "${NEO4J_PASSWORD:-mediation123}", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================================
  # MinIO
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: mediation-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-mediation}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-mediation123456}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - mediation-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ============================================================
  # Nginx
  # ============================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: mediation-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mediation-net

networks:
  mediation-net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  nacos_data:
  nacos_logs:
  neo4j_data:
  neo4j_logs:
  minio_data:
  nginx_logs:
