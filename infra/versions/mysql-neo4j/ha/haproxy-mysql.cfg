# HAProxy for MySQL Cluster
global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    retries 3
    timeout client  3600s
    timeout server  3600s
    timeout connect 10s

# Admin Stats
listen admin_stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 30s
    stats auth admin:admin

# MySQL Cluster Load Balancer
listen mysql_cluster
    bind *:33060
    mode tcp
    option mysql-check user haproxy
    balance roundrobin
    server mysql1 mysql-1:3306 check inter 5s rise 2 fall 3
    server mysql2 mysql-2:3306 check inter 5s rise 2 fall 3
    server mysql3 mysql-3:3306 check inter 5s rise 2 fall 3
