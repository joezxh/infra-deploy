# HAProxy for Neo4j Cluster
global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    retries 3
    timeout client  3600s
    timeout server  3600s

# Neo4j Bolt Protocol Load Balancer
listen neo4j-bolt
    bind *:7687
    mode tcp
    balance roundrobin
    server neo4j1 neo4j-1:7687 check inter 5s rise 2 fall 3
    server neo4j2 neo4j-2:7687 check inter 5s rise 2 fall 3

# Neo4j HTTP Load Balancer
listen neo4j-http
    bind *:7474
    mode http
    balance roundrobin
    option httpchk GET /
    server neo4j1 neo4j-1:7474 check inter 5s rise 2 fall 3
    server neo4j2 neo4j-2:7474 check inter 5s rise 2 fall 3
