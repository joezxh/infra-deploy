user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # 基础配置
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 上游服务器（后端微服务，宿主机运行）
    # 使用 host.docker.internal 访问宿主机
    upstream gateway {
        server host.docker.internal:8080;
        keepalive 32;
    }

    upstream uaa {
        server host.docker.internal:8081;
        keepalive 32;
    }

    upstream user {
        server host.docker.internal:8082;
        keepalive 32;
    }

    upstream organization {
        server host.docker.internal:8083;
        keepalive 32;
    }

    upstream case {
        server host.docker.internal:8084;
        keepalive 32;
    }

    upstream mediation {
        server host.docker.internal:8085;
        keepalive 32;
    }

    upstream notice {
        server host.docker.internal:8086;
        keepalive 32;
    }

    upstream dispatch {
        server host.docker.internal:8087;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # API Gateway (所有 /api/ 请求)
        location /api/ {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # WebSocket (调解服务)
        location /ws/ {
            proxy_pass http://mediation;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
        }

        # Swagger文档
        location /doc.html {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
        }

        location /swagger-ui/ {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
        }

        location /v3/api-docs/ {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
        }

        # 静态资源（前端）
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # 错误页面
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
